
name: Build ATMOS APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "atmos-radar-wind"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unpack ATMOS project
        run: unzip -o ATMOS_Android_Project.zip -d project

      - name: Apply ATMOS premium app source
        run: cp app/src/main/java/pl/atmos/weather/MainActivity.kt project/app/src/main/java/pl/atmos/weather/MainActivity.kt

      - name: Build ATMOS APK
        run: cd project && gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ATMOS-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          

# Rebuild after restoring ATMOS city picker and weather startup.
