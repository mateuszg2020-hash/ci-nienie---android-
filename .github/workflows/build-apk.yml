
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unpack project
        run: unzip -o CisnienieAndroid_GitHub.zip -d project

      - name: Fix Java and Kotlin versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("project/app/build.gradle.kts")
          s = p.read_text()
          if "sourceCompatibility" not in s:
              i = s.rfind("\n}")
              s = s[:i] + """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          """ + s[i:]
          p.write_text(s)
          PY

      - name: Build APK
        run: cd project && gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Cisnienie-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          
          
