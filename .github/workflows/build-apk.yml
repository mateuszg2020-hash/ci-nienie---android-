
name: Build ATMOS APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "atmos-radar-wind"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unpack ATMOS project
        run: unzip -o ATMOS_Android_Project.zip -d project

      - name: Apply ATMOS premium app source
        run: cp app/src/main/java/pl/atmos/weather/MainActivity.kt project/app/src/main/java/pl/atmos/weather/MainActivity.kt


      - name: Set ATMOS Pogoda branding and weather icon
        run: |
          mkdir -p project/app/src/main/res/mipmap-anydpi project/app/src/main/res/mipmap-anydpi-v26 project/app/src/main/res/drawable project/app/src/main/res/values
          cat > project/app/src/main/res/values/atmos_icon_colors.xml <<'EOF'
          <resources><color name="atmos_icon_bg">#081729</color></resources>
          EOF
          cat > project/app/src/main/res/drawable/atmos_icon_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#FFB52E" android:pathData="M72,12a23,23 0,1 0,0.1 0z"/>
            <path android:fillColor="#FFFFD7" android:pathData="M72,16a19,19 0,1 0,0.1 0z"/>
            <path android:fillColor="#16466B" android:pathData="M22,76c-9,-1 -15,-8 -15,-17 0,-9 7,-16 16,-17 4,-14 16,-23 31,-21 13,1 22,10 25,22 11,0 20,9 20,20 0,8 -5,15 -12,18z"/>
            <path android:fillColor="#F5FAFF" android:pathData="M21,72c-7,0 -12,-5 -12,-12 0,-7 6,-13 13,-13 4,-13 15,-20 27,-19 12,1 20,9 22,20 10,-1 18,6 18,16 0,5 -3,9 -7,12z"/>
            <path android:fillColor="#B9DFFF" android:pathData="M20,75c-7,0 -12,-5 -12,-12 0,-7 6,-13 13,-13 4,-12 14,-19 26,-19 11,0 20,8 22,19 9,-1 17,6 17,15 0,6 -5,10 -11,10z"/>
            <path android:fillColor="#50D8F2" android:pathData="M30,81c-1,0 -2,-1 -2,-2 0,-1 4,-8 5,-8 1,0 5,7 5,8 0,1 -1,2 -2,2z M49,86c-1,0 -2,-1 -2,-2 0,-1 4,-8 5,-8 1,0 5,7 5,8 0,1 -1,2 -2,2z M68,81c-1,0 -2,-1 -2,-2 0,-1 4,-8 5,-8 1,0 5,7 5,8 0,1 -1,2 -2,2z"/>
            <path android:fillColor="#FFD166" android:pathData="M82,62l-11,15h8l-5,13 16,-19h-9l5,-9z"/>
          </vector>
          EOF
          cat > project/app/src/main/res/mipmap-anydpi/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="48dp" android:height="48dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#081729" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#FFC857" android:pathData="M72,17a19,19 0,1 0,0.1 0z"/>
            <path android:fillColor="#DCEEFF" android:pathData="M31,78h48c8,0 14,-6 14,-14s-6,-14 -14,-14h-5l-1,-5c-2,-9 -10,-15 -20,-15 -11,0 -20,8 -21,19l-1,5 -5,-1c-8,0 -14,6 -14,13s6,12 14,12z"/>
          </vector>
          EOF
          cp project/app/src/main/res/mipmap-anydpi/ic_launcher.xml project/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml
          for name in ic_launcher ic_launcher_round; do
            cat > project/app/src/main/res/mipmap-anydpi-v26/$name.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/atmos_icon_bg"/>
            <foreground android:drawable="@drawable/atmos_icon_fg"/>
          </adaptive-icon>
          EOF
          done
          if [ -f project/app/src/main/res/values/strings.xml ]; then
            sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">ATMOS pogoda</string>#' project/app/src/main/res/values/strings.xml
          fi
          sed -i 's#android:label="[^"]*"#android:label="ATMOS pogoda"#' project/app/src/main/AndroidManifest.xml
          if grep -q 'android:icon=' project/app/src/main/AndroidManifest.xml; then sed -i 's#android:icon="[^"]*"#android:icon="@mipmap/ic_launcher"#' project/app/src/main/AndroidManifest.xml; else sed -i 's#<application#<application android:icon="@mipmap/ic_launcher"#' project/app/src/main/AndroidManifest.xml; fi
          if grep -q 'android:roundIcon=' project/app/src/main/AndroidManifest.xml; then sed -i 's#android:roundIcon="[^"]*"#android:roundIcon="@mipmap/ic_launcher_round"#' project/app/src/main/AndroidManifest.xml; else sed -i 's#<application#<application android:roundIcon="@mipmap/ic_launcher_round"#' project/app/src/main/AndroidManifest.xml; fi
          grep -n 'android:label\|android:icon\|android:roundIcon' project/app/src/main/AndroidManifest.xml

      - name: Validate embedded ATMOS JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("app/src/main/java/pl/atmos/weather/MainActivity.kt").read_text()
          html = source.split('private val PAGE = """', 1)[1]
          js = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/atmos.js").write_text(js)
          PY
          node --check /tmp/atmos.js

      - name: Build ATMOS APK
        run: cd project && gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ATMOS-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          

