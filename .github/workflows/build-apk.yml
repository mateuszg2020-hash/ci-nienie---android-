name: Build ATMOS Premium APK

on:
  workflow_dispatch:
  push:
    branches: ["atmos-premium"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unpack Android project
        run: unzip -o ATMOS_Android_Project.zip -d project

      - name: Apply ATMOS premium app
        run: |
          mkdir -p project/app/src/main
          cp -R app/src/main/. project/app/src/main/

      - name: Build APK
        run: cd project && gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ATMOS-Premium-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
